spring.application.name=trip-service
server.port=8082
spring.datasource.url=jdbc:h2:mem:tripdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
trip.integration.user-base-url=http://localhost:8081
trip.integration.user-sync-enabled=true
trip.integration.events.exchange=trip.events
trip.integration.events.routing-key=trip.status.changed
spring.cache.type=simple
spring.data.redis.host=localhost
spring.data.redis.port=6379
security.jwt.secret=ChangeThisSecretKeyToAtLeast32BytesForHS256
security.jwt.expiration-seconds=3600
