plugins {
	id 'base'
}

group = 'com.example.taxi'
version = '0.1.0-SNAPSHOT'

allprojects {
	repositories {
		mavenCentral()
	}
}

subprojects {
	apply plugin: 'java'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(17)
		}
	}

	tasks.withType(Test).configureEach {
		useJUnitPlatform()
	}
}
